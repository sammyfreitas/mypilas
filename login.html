<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyPilas - Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body class="pagina-login">
    <header>
        <h1>MyPilas</h1>

    </header>


    <main class="container-login">
        <div class="card-login">
            <h2> Acesse sua conta </h2>
            <p> Informe seu usuário e senha</p>


            <label for="usuario">Usuário:</label>   
            <input type="text" id="usuario" placeholder="Digite seu nome de usuário">

            <label for="senha">Senha:</label>   
            <input type="password" id="senha" placeholder="Digite sua senha">

            <button class="btn-entrar" onclick="entrar()">
            Entrar
        </button>

        <p id="mensagem"></p>

        <a href="index.html">
            Voltar para a página inicial
        </a>

    </div>

</main>

    <script src="javascripts/login.js"></script>
    
    <footer>
        <p>MyPilas | Todos os direitos reservados © 2026</p>

    </footer>


</body>
</html>
